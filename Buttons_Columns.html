<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5x4 Colored Button Grid</title>
    <style>
      body {
        background: linear-gradient(
          135deg,
          rgb(11, 31, 132),
          rgb(5, 49, 73),
          rgb(63, 132, 129),
          rgb(5, 49, 73),
          rgb(11, 31, 132)
        );
        background-size: 350% 350%;

        animation: gradient 5s ease infinite;
        height: 200vh;
      }

      @keyframes gradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      /* Grid container: creates 3 equal columns */
      .button-grid {
        display: grid;
        grid-template-columns: repeat(5, 4fr);
        gap: 50px; /* Space between rows and columns */
        max-width: 600px;
        margin: 40px auto;
      }

      .grid-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      /* Shared styling for all buttons */
      .btn {
        padding: 16px 20px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        border: none;
        border-radius: 100px;
        cursor: pointer;
        transition: opacity 0.5s ease;
      }

      .btn:hover {
        opacity: 0.55;
      }

      .slider {
        width: 100%;
        cursor: pointer;
      }

      /* Individual button colors */
      .btn-1 {
        background-color: #ff0303;
        color: #5ec6a2;
      } /* Red */
      .btn-2 {
        background-color: #bd614e;
        color: #6f5ec6;
      } /* Orange */
      .btn-3 {
        background-color: #b67846;
        color: #5b1877;
      } /* Yellow with dark text */
      .btn-4 {
        background-color: #2a9d8f;
        color: #49b928;
      } /* Teal */
      .btn-5 {
        background-color: #457b9d;
        color: #dd1e1e;
      } /* Steel Blue */
      .btn-6 {
        background-color: #1d3557;
        color: #eaecee;
      } /* Navy */
      .btn-7 {
        background-color: #8338ec;
        color: #79b580;
      } /* Purple */
      .btn-8 {
        background-color: #ff006e;
        color: #751e97;
      } /* Magenta */
      .btn-9 {
        background-color: #38b000;
        color: #331fb6;
      } /* Green */
      .btn-10 {
        background-color: #b14572;
        color: #f015d6;
      } /* Green */
      .btn-11 {
        background-color: #b00087;
        color: #e3c621;
      } /* Green */
      .btn-12 {
        background-color: #255877;
        color: #19bdd0;
      } /* Green */
      .btn-13 {
        background-color: #b0009b;
        color: #2ccf26;
      } /* Green */
      .btn-14 {
        background-color: #82c0d4;
        color: #b81aa8;
      } /* Green */
      .btn-15 {
        background-color: #b02a40;
        color: #222;
      } /* Green */
      .btn-16 {
        background-color: #d3df29;
        color: #3015ad;
      } /* Green */
      .btn-17 {
        background-color: #b824c6;
        color: #22c313;
      } /* Green */
      .btn-18 {
        background-color: #c36e39;
        color: #1ecad0;
      } /* Green */
      .btn-19 {
        background-color: #b00067;
        color: #adcf24;
      } /* Green */
      .btn-20 {
        background-color: #b09800;
        color: #4911ca;
      } /* Green */
    </style>
  </head>
  <body>
    <div class="button-grid">
      <div class="grid-item">
        <button class="btn btn-1">1</button>
        <input
          type="range"

    </div>

    <script>
      const sliders = document.querySelectorAll(".slider");
      const buttons = document.querySelectorAll(".btn");
      sliders.forEach((slider, index) => {
        slider.addEventListener("input", () => {
          const value = slider.value;
          buttons[index].style.padding = value / 5 + "px";
          buttons[index].style.fontSize = value / 5 + "px";
          buttons[index].style.opacity = value / 100;
        });
      });
    </script>
